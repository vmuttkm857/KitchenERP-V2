[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kitchenerp-v2-backend"
version = "0.1.0"
description = "KitchenERP V2 FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "openpyxl>=3.1,<4",
  "Pillow>=12,<13",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "httpx2>=2.0,<3", "pytest>=8.3,<9", "pypdf>=5,<7"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a real PostgreSQL database"]
